services:
  db:
    image: postgres:16-alpine
    container_name: bim_logistics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bim_logistics_db
      POSTGRES_USER: bim_logistics_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Khai bao DB_PASSWORD trong file .env}
    ports:
      - "127.0.0.1:5435:5432" # Chỉ mở trên localhost nội bộ máy chủ, không mở ra Internet
    volumes:
      - bim_logistics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bim_logistics_user -d bim_logistics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: bim_logistics_web
    restart: unless-stopped
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: bim_logistics_db
      DB_USER: bim_logistics_user
      DB_PASSWORD: ${DB_PASSWORD:?Khai bao DB_PASSWORD trong file .env}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings
    ports:
      - "127.0.0.1:8085:8000" # Chỉ mở nội bộ máy chủ; truy cập từ ngoài đi qua Nginx (HTTPS)
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"

volumes:
  bim_logistics_postgres_data:
