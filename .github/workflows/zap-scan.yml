# Quét lỗ hổng web tự động (OWASP ZAP baseline — chỉ quét thụ động, không tấn công, không ghi dữ liệu) hằng tuần.
# Kết quả: issue "ZAP: kết quả quét bảo mật" trên GitHub (tự cập nhật) + báo cáo HTML trong Artifacts của lần chạy.
name: Security scan (ZAP)

# Lịch tự chạy đang TẮT cho tới khi GSS có domain riêng (đặt biến SITE_URL rồi thêm lại schedule).
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline — trang công khai
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "${{ vars.SITE_URL }}/login/"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          issue_title: "ZAP: kết quả quét bảo mật"
          allow_issue_writing: true
          fail_action: false  # phát hiện mới được ghi vào issue (GitHub gửi thông báo), không làm đỏ workflow
