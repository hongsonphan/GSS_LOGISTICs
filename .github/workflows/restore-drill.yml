# Diễn tập khôi phục hằng tuần: khôi phục bản sao lưu mới nhất vào CSDL tạm trên VPS, so số liệu, xoá CSDL tạm.
# Lỗi -> workflow đỏ -> GitHub gửi email cho chủ repo.
name: Restore drill

on:
  schedule:
    - cron: "17 20 * * 0"   # 03:17 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Khôi phục thử bản sao lưu mới nhất
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "${USER:-ubuntu}@$HOST" 'bash /home/ubuntu/BIM_LOGISTICS/scripts/restore_drill.sh'
