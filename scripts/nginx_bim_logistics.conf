server {
    server_name logistics.bim.info.vn;
    client_max_body_size 50M;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location = /favicon.ico { 
        proxy_pass http://127.0.0.1:8085/static/favicon.ico;
        access_log off; 
        log_not_found off; 
    }

    location /static/ {
        alias /home/ubuntu/BIM_LOGISTICS/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # /media/ KHÔNG phục vụ trực tiếp nữa: đi qua Django để kiểm tra quyền (đăng nhập hoặc link tài xế/tra cứu).
    # Django trả header X-Accel-Redirect (khi MEDIA_USE_X_ACCEL=True) -> Nginx gửi file từ location nội bộ dưới đây.
    location /protected-media/ {
        internal;
        alias /home/ubuntu/BIM_LOGISTICS/media/;
        add_header Cache-Control "private, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/logistics.bim.info.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.bim.info.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name logistics.bim.info.vn;
    return 301 https://$host$request_uri;
}
