server {
    server_name logistics.bim.info.vn;
    client_max_body_size 50M;

    server_tokens off;
    # X-Frame-Options / X-Content-Type-Options do Django đặt; không lặp lại ở đây để tránh header trùng
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /favicon.ico { 
        proxy_pass http://127.0.0.1:8085/static/favicon.ico;
        access_log off; 
        log_not_found off; 
    }

    # Nén dữ liệu gửi về trình duyệt (HTML, JSON API, CSS, JS): giảm ~80% dung lượng tải
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # File có mã băm trong tên (vd app.7c1cdc41422e.js) không bao giờ đổi nội dung -> cache 1 năm
    location ~* "^/static/(.+\.[0-9a-f]{12}\.(?:js|css|png|jpg|jpeg|svg|ico|woff2?))$" {
        alias /home/ubuntu/BIM_LOGISTICS/staticfiles/$1;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        alias /home/ubuntu/BIM_LOGISTICS/staticfiles/;
        gzip_static on;   # dùng sẵn file .gz do collectstatic tạo
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # /media/ KHÔNG phục vụ trực tiếp nữa: đi qua Django để kiểm tra quyền (đăng nhập hoặc link tài xế/tra cứu).
    # Django trả header X-Accel-Redirect (khi MEDIA_USE_X_ACCEL=True) -> Nginx gửi file từ location nội bộ dưới đây.
    location /protected-media/ {
        internal;
        alias /home/ubuntu/BIM_LOGISTICS/media/;
        add_header Cache-Control "private, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/logistics.bim.info.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.bim.info.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name logistics.bim.info.vn;
    return 301 https://$host$request_uri;
}
