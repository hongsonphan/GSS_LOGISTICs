{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Không tìm thấy chuyến xe - GSS Logistics</title>
  <link rel="stylesheet" type="text/css" href="{% static 'vendor/phosphor/regular/style.css' %}"/>
  <link rel="stylesheet" type="text/css" href="{% static 'vendor/phosphor/bold/style.css' %}"/>
  <link rel="stylesheet" type="text/css" href="{% static 'vendor/phosphor/fill/style.css' %}"/>
  <link href="{% static 'vendor/fontawesome/css/all.min.css' %}" rel="stylesheet" />
  <style>
    @import url("{% static 'vendor/fonts/fonts.css' %}");
    body { font-family: "Inter", sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
  <!-- Tailwind CSS (build sẵn, đặt cuối <head> để giữ thứ tự ưu tiên như bản CDN cũ) -->
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between text-slate-800 p-4">
  <div class="flex-1 flex flex-col items-center justify-center text-center py-12">
    <div class="w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mb-6 shadow-sm">
      <i class="ph-bold ph-warning-circle text-4xl"></i>
    </div>
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Không tìm thấy chuyến xe</h1>
    <p class="text-sm text-slate-600 max-w-xs mb-6">
      Mã chuyến xe hoặc liên kết điều vận không tồn tại hoặc đã hết hiệu lực trên hệ thống.
    </p>
    <div class="bg-white border border-slate-200 rounded-xl p-4 w-full max-w-sm mb-6 shadow-sm text-left">
      <div class="text-xs text-slate-500 font-medium">Mã liên kết nhận được:</div>
      <div class="font-mono text-sm text-slate-700 font-semibold break-all mt-1 bg-slate-100 p-2 rounded">
        {{ trip_hash }}
      </div>
    </div>
    <a href="tel:0908123456" class="inline-flex items-center justify-center gap-2 w-full max-w-sm bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md transition-all active:scale-[0.98]">
      <i class="ph-bold ph-phone-call text-lg"></i>
      <span>Gọi hotline Điều độ hỗ trợ</span>
    </a>
  </div>
  <footer class="text-center text-xs text-slate-600 py-4">
    GSS Logistics — Hệ Thống Quản Lý Vận Tải
  </footer>
</body>
</html>
