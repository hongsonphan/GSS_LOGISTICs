<!-- TOP NAVIGATION BAR -->
<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-10 shadow-sm">
    <div class="flex items-center text-slate-500 w-1/3">
        <div class="relative w-full max-w-md hidden md:block">
            <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
            <input id="top-search-input" onkeyup="handleSearch(event)" type="text" placeholder="Tìm kiếm mã chuyến, biển số, container, booking..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition-all font-medium placeholder:text-slate-400" />
        </div>
    </div>
    <div class="flex items-center space-x-4">
        <div class="hidden sm:flex items-center text-xs font-semibold text-slate-600 bg-slate-50 px-3.5 py-1.5 rounded-full border border-slate-200">
            <i class="ph ph-clock text-teal-600 mr-1.5 text-base"></i> <span id="current-date">Hôm nay</span>
        </div>
        <div class="flex items-center text-xs font-bold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full border border-emerald-200 shadow-sm">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> PostgreSQL Connected
        </div>
        <button class="relative p-2 text-slate-400 hover:text-slate-600 transition-colors rounded-full hover:bg-slate-100">
            <i class="ph ph-bell text-xl"></i>
            <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full border-2 border-white"></span>
        </button>
    </div>
</header>
