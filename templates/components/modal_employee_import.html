<!-- MODAL NHẬP HỒ SƠ NHÂN SỰ TỪ EXCEL (EMPLOYEE EXCEL IMPORT MODAL) -->
<div id="modal-employee-import" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
        <!-- Header -->
        <div class="bg-gradient-to-r from-teal-800 to-teal-950 text-white px-5 py-3.5 flex items-center justify-between border-b border-teal-700">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-teal-600/50 flex items-center justify-center text-teal-200 border border-teal-400/30">
                    <i class="ph-bold ph-users-three text-lg"></i>
                </div>
                <div>
                    <h3 class="text-sm font-black font-heading leading-tight tracking-tight">Nhập Danh Sách Nhân Sự Từ File Excel</h3>
                    <p class="text-[11px] text-teal-300 font-medium">Hồ sơ nhân viên, tài xế & định danh pháp lý Green Solutions Supply</p>
                </div>
            </div>
            <button onclick="closeEmployeeImportModal()" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                <i class="ph-bold ph-x text-base"></i>
            </button>
        </div>

        <!-- Form Body -->
        <form id="form-employee-import" onsubmit="submitEmployeeImport(event)" class="p-4 md:p-5 space-y-4">
            <!-- 1. Hộp Tải Mẫu Nhanh -->
            <div class="p-3 bg-teal-50/70 border border-teal-200/80 rounded-xl flex items-center justify-between gap-3 text-xs">
                <div class="flex items-center space-x-2 text-teal-900">
                    <i class="ph-bold ph-info text-base text-teal-700 shrink-0"></i>
                    <span class="font-medium">Chưa có file mẫu chuẩn hồ sơ nhân sự?</span>
                </div>
                <button type="button" onclick="downloadEmployeeTemplate()" class="px-2.5 py-1 bg-white hover:bg-teal-600 hover:text-white text-teal-800 border border-teal-300 font-bold rounded-lg text-xs shadow-2xs flex items-center space-x-1 shrink-0 transition-colors cursor-pointer">
                    <i class="ph-bold ph-download-simple"></i>
                    <span>Tải Mẫu Excel</span>
                </button>
            </div>

            <!-- 2. Khu vực kéo thả / chọn file -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Tệp Dữ Liệu Excel (.xlsx) <span class="text-rose-500">*</span>
                </label>
                <div id="emp-dropzone" 
                     class="border-2 border-dashed border-slate-300 hover:border-teal-500 bg-slate-50/60 hover:bg-teal-50/20 rounded-xl p-5 text-center transition-all cursor-pointer flex flex-col items-center justify-center space-y-2 select-none"
                     onclick="document.getElementById('emp-import-file-input').click()">
                    <input type="file" id="emp-import-file-input" accept=".xlsx,.xls" class="hidden" onchange="handleEmployeeImportFileSelected(this)">
                    
                    <div class="w-12 h-12 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center">
                        <i class="ph-bold ph-microsoft-excel-logo text-2xl"></i>
                    </div>

                    <div id="emp-dropzone-prompt">
                        <p class="text-xs md:text-sm font-bold text-slate-800">
                            Nhấn để chọn tệp hoặc kéo thả vào đây
                        </p>
                        <p class="text-[11px] text-slate-500 mt-0.5">
                            Định dạng hỗ trợ: Microsoft Excel (.xlsx, .xls) — Tối đa 15MB
                        </p>
                    </div>

                    <!-- File info preview -->
                    <div id="emp-file-info-preview" class="hidden flex items-center space-x-2 bg-white px-3 py-1.5 rounded-lg border border-teal-300 text-xs font-bold text-teal-900 shadow-2xs">
                        <i class="ph-bold ph-file-xls text-base text-emerald-600"></i>
                        <span id="emp-file-name" class="max-w-[260px] truncate">chua_chon_file.xlsx</span>
                        <span id="emp-file-size" class="text-slate-400 font-normal">(0 KB)</span>
                        <button type="button" onclick="event.stopPropagation(); clearEmployeeImportFileInput();" class="text-slate-400 hover:text-rose-600 p-0.5 ml-1">
                            <i class="ph-bold ph-x text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 3. Tùy chọn Import -->
            <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                <label class="flex items-start space-x-2.5 cursor-pointer select-none">
                    <input type="checkbox" id="emp-import-update-existing" class="mt-0.5 w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500 cursor-pointer" checked>
                    <div>
                        <span class="text-xs font-bold text-slate-800 block">Cập nhật hồ sơ nếu Mã Nhân Viên hoặc SĐT đã tồn tại</span>
                        <span class="text-[11px] text-slate-500 leading-relaxed block">
                            Nếu bỏ chọn, hệ thống sẽ bỏ qua các nhân sự đã có và chỉ thêm mới các hồ sơ chưa tồn tại.
                        </span>
                    </div>
                </label>
            </div>

            <!-- 4. Hộp hiển thị kết quả sau khi import -->
            <div id="emp-import-result-box" class="hidden rounded-xl p-3.5 text-xs space-y-2 border">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Footer Buttons -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2.5">
                <button type="button" onclick="closeEmployeeImportModal()" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold font-heading transition-colors cursor-pointer">
                    Đóng
                </button>
                <button type="submit" id="emp-import-submit-btn" class="px-4 py-1.5 bg-teal-700 hover:bg-teal-800 text-white rounded-lg text-xs font-bold font-heading shadow-xs flex items-center space-x-1.5 transition-colors cursor-pointer">
                    <i class="ph-bold ph-upload-simple text-sm"></i>
                    <span>Bắt Đầu Nhập Dữ Liệu</span>
                </button>
            </div>
        </form>
    </div>
</div>
