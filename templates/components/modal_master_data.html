<!-- MODAL KHAI BÁO & CHỈNH SỬA DANH MỤC (MASTER DATA MODAL) -->
<div id="modal-master-data" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
        <!-- Header -->
        <div class="bg-gradient-to-r from-teal-800 to-teal-950 text-white p-5 flex items-center justify-between border-b border-teal-700">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-teal-600/50 flex items-center justify-center text-teal-200 border border-teal-400/30">
                    <i id="md-modal-icon" class="ph-bold ph-pencil-simple text-lg"></i>
                </div>
                <div>
                    <h3 id="md-modal-title" class="text-base font-black font-heading leading-tight tracking-tight">Khai Báo Danh Mục</h3>
                    <p id="md-modal-subtitle" class="text-xs text-teal-300 font-medium">Cập nhật thông tin chuẩn vào hệ thống</p>
                </div>
            </div>
            <button onclick="closeMasterDataModal()" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 transition-colors">
                <i class="ph-bold ph-x text-lg"></i>
            </button>
        </div>

        <!-- Form Body -->
        <form id="form-master-data" onsubmit="submitMasterDataForm(event)" class="p-5 md:p-6 space-y-4 max-h-[75vh] overflow-y-auto">
            <input type="hidden" id="md-edit-id" value="">
            <input type="hidden" id="md-catalog-key" value="">

            <!-- Dynamic Form Fields will be injected here -->
            <div id="md-modal-fields-container" class="space-y-4">
                <!-- Injected via JavaScript based on active catalog -->
            </div>

            <!-- Footer Actions -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                <button type="button" onclick="closeMasterDataModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold font-heading transition-colors cursor-pointer">
                    Hủy Bỏ
                </button>
                <button type="submit" id="md-submit-btn" class="px-5 py-2 bg-teal-700 hover:bg-teal-800 text-white rounded-xl text-xs font-bold font-heading shadow-xs flex items-center space-x-2 transition-colors cursor-pointer">
                    <i class="ph-bold ph-check text-base"></i>
                    <span>Lưu Bản Ghi</span>
                </button>
            </div>
        </form>
    </div>
</div>
