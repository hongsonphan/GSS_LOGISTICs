<!-- MODAL TẠO LỆNH ĐIỀU ĐỘNG (Bim_ERP-Solutions Defensive Form Standard) -->
<div id="modal-create-trip" class="fixed inset-0 bg-slate-900/60 z-50 hidden-view flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-5xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh] animate-slide-up border border-slate-200">
        <div class="flex justify-between items-center px-6 py-4 border-b bg-slate-50">
            <h3 class="text-[17px] font-bold text-slate-800 flex items-center font-heading">
                <i class="ph-fill ph-plus-circle text-teal-600 text-2xl mr-2.5"></i> Tạo Lệnh Điều Động Mới (Lưu Vào Database Thật)
            </h3>
            <button onclick="closeModal('modal-create-trip')" class="p-1.5 hover:bg-slate-200 rounded-lg text-slate-400 hover:text-slate-600 transition-colors">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        
        <div class="p-6 flex-1 overflow-y-auto bg-slate-50/40">
            <form id="form-create-trip" onsubmit="event.preventDefault(); submitNewTrip();" class="space-y-5" novalidate>
                
                <!-- Section 1: Chứng từ & Phân loại -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center font-heading text-[15px]">
                        <i class="ph-fill ph-file-text text-teal-600 mr-2"></i> 1. Thông Tin Khách Hàng & Vận Đơn
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="md:col-span-2">
                            <label class="form-label" for="inp-customer">Khách hàng / Chủ hàng <span class="text-rose-500">*</span></label>
                            <input id="inp-customer" type="text" placeholder="VD: TĐÁ - VICACO, WCA - TTI..." class="form-input uppercase" required>
                            <div id="err-customer" class="field-error-msg hidden"></div>
                        </div>
                        <div>
                            <label class="form-label" for="inp-type">Loại Hình <span class="text-rose-500">*</span></label>
                            <select id="inp-type" class="form-select font-bold text-teal-800">
                                <option value="Nhập">Hàng Nhập (Cảng -> Kho)</option>
                                <option value="Xuất">Hàng Xuất (Kho -> Cảng)</option>
                                <option value="Nội địa">Nội địa / Chuyển kho</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="inp-cont-type">Loại Cont / Xe</label>
                            <select id="inp-cont-type" class="form-select font-medium">
                                <option value="40HC">Cont 40 HC</option>
                                <option value="20DC">Cont 20 DC</option>
                                <option value="Xe tải 10T">Xe tải 10 Tấn</option>
                                <option value="Xe tải 2T">Xe tải 2 Tấn</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="inp-booking">Số Booking / B/L</label>
                            <input id="inp-booking" type="text" placeholder="VD: 235601091589" class="form-input uppercase">
                        </div>
                        <div>
                            <label class="form-label" for="inp-cont">Số Container</label>
                            <input id="inp-cont" type="text" placeholder="VD: CAAU5214215XX" class="form-input uppercase">
                        </div>
                        <div>
                            <label class="form-label" for="inp-seal">Số Chì (Seal)</label>
                            <input id="inp-seal" type="text" placeholder="VD: SL-998877" class="form-input uppercase">
                        </div>
                        <div>
                            <label class="form-label" for="inp-cutoff">Hạn Cắt Máng / Giờ SI</label>
                            <input id="inp-cutoff" type="text" placeholder="VD: SI 10:00" class="form-input text-rose-700 bg-rose-50/50 border-rose-200 font-bold">
                        </div>
                    </div>
                </div>

                <!-- Section 2: Lộ Trình 3 Điểm -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center font-heading text-[15px]">
                        <i class="ph-fill ph-map-pin text-teal-600 mr-2"></i> 2. Lộ Trình Vận Chuyển (Nơi Lấy - Đóng/Trả - Nơi Hạ)
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-teal-50/40 p-4 rounded-xl border border-teal-100">
                            <label class="form-label text-teal-900" for="inp-pickup">1. Nơi Lấy (Cảng / Bãi) <span class="text-rose-500">*</span></label>
                            <input id="inp-pickup" type="text" placeholder="VD: SPITC, CÁT LÁI, TĐÁ..." class="form-input uppercase mb-1" required>
                            <div id="err-pickup" class="field-error-msg hidden"></div>
                        </div>
                        <div class="bg-amber-50/40 p-4 rounded-xl border border-amber-100">
                            <label class="form-label text-amber-900" for="inp-warehouse">2. Nơi Đóng/Trả (Kho KH) <span class="text-rose-500">*</span></label>
                            <input id="inp-warehouse" type="text" placeholder="VD: MACSTAR TÂN VẠN, KHO WCA..." class="form-input uppercase mb-1" required>
                            <div id="err-warehouse" class="field-error-msg hidden"></div>
                        </div>
                        <div class="bg-emerald-50/40 p-4 rounded-xl border border-emerald-100">
                            <label class="form-label text-emerald-900" for="inp-dropoff">3. Nơi Hạ (Bãi Rỗng)</label>
                            <input id="inp-dropoff" type="text" placeholder="VD: SOLOG LIBRA, VSIP 3..." class="form-input uppercase mb-1">
                        </div>
                    </div>
                </div>

                <!-- Section 3: Phân công & Ghi chú -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center font-heading text-[15px]">
                        <i class="ph-fill ph-users text-teal-600 mr-2"></i> 3. Phân Công Tài Xế & Ghi Chú Chi Phí
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="form-label" for="inp-driver">Tài xế nhận lệnh <span class="text-rose-500">*</span></label>
                            <select id="inp-driver" class="form-select font-bold text-slate-800" required>
                                <option value="">-- Chọn tài xế điều động --</option>
                                <option value="61S">61S (BỘT SẮT - Đầu kéo 61S-999.00)</option>
                                <option value="BỤI 94">BỤI 94 (Đầu kéo 51C-123.45)</option>
                                <option value="LIBRA">LIBRA (Đầu kéo 51C-888.99)</option>
                                <option value="HÒA PHÁT">HÒA PHÁT (Đầu kéo 61C-393.29)</option>
                                <option value="3S">TÀI XẾ 3S (Xe tải 10T - 50E-745.02)</option>
                                <option value="HẢI ĐĂNG">HẢI ĐĂNG (Xe tải 2T - 50E-112.34)</option>
                            </select>
                            <div id="err-driver" class="field-error-msg hidden"></div>
                        </div>
                        <div>
                            <label class="form-label" for="inp-notes">Ghi chú phí Công ty chịu / Lưu ý Điều độ</label>
                            <input id="inp-notes" type="text" placeholder="VD: Xin trái tuyến Đồng An 320k TVL chịu, Free time 3 ngày..." class="form-input bg-amber-50/40 border-amber-200 text-amber-950 font-medium">
                        </div>
                    </div>
                </div>
                
                <div class="pt-3 border-t border-slate-200 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('modal-create-trip')" class="btn-amis-secondary">
                        <i class="ph ph-x"></i> Hủy
                    </button>
                    <button type="submit" class="btn-amis-primary px-6 py-2.5">
                        <i class="ph-fill ph-paper-plane-right text-lg"></i> Lưu Vào DB & Phát Lệnh Zalo
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
