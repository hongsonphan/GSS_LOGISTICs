<!-- MODAL TẠO LỆNH ĐIỀU ĐỘNG -->
<div id="modal-create-trip" class="fixed inset-0 bg-slate-900/60 z-50 hidden-view flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-5xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh] animate-slide-up">
        <div class="flex justify-between items-center p-5 border-b bg-slate-50">
            <h3 class="text-lg font-bold text-slate-800 flex items-center font-heading">
                <i class="ph-fill ph-plus-circle text-teal-700 text-xl mr-2"></i> Tạo Lệnh Điều Động Mới (Lưu Vào Database Thật)
            </h3>
            <button onclick="closeModal('modal-create-trip')" class="p-2 hover:bg-slate-200 rounded-full text-slate-500 transition-colors">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto bg-slate-50/50">
            <form id="form-create-trip" onsubmit="event.preventDefault(); submitNewTrip();" class="space-y-6">
                
                <!-- Section 1: Chứng từ & Phân loại -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="font-bold text-slate-700 mb-4 pb-2 border-b flex items-center font-heading">
                        <i class="ph-fill ph-file-text text-teal-600 mr-2"></i> 1. Chứng từ & Phân loại
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Khách hàng <span class="text-rose-500">*</span></label>
                            <input id="inp-customer" type="text" placeholder="VD: TĐÁ - VICACO, WCA - TTI..." class="w-full p-2.5 border rounded-lg text-sm font-medium uppercase focus:ring-2 focus:ring-teal-500 focus:outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Loại Hình <span class="text-rose-500">*</span></label>
                            <select id="inp-type" class="w-full p-2.5 border rounded-lg text-sm text-teal-800 font-bold focus:ring-2 focus:ring-teal-500 focus:outline-none">
                                <option value="Nhập">Hàng Nhập</option>
                                <option value="Xuất">Hàng Xuất</option>
                                <option value="Nội địa">Nội địa / Chuyển kho</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Loại Cont/Xe</label>
                            <select id="inp-cont-type" class="w-full p-2.5 border rounded-lg text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:outline-none">
                                <option value="40HC">Cont 40 HC</option>
                                <option value="20DC">Cont 20 DC</option>
                                <option value="Xe tải 10T">Xe tải 10T</option>
                                <option value="Xe tải 2T">Xe tải 2T</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Booking / B/L</label>
                            <input id="inp-booking" type="text" placeholder="VD: 235601091589" class="w-full p-2.5 border rounded-lg text-sm uppercase focus:outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Số Container</label>
                            <input id="inp-cont" type="text" placeholder="VD: CAAU5214215XX" class="w-full p-2.5 border rounded-lg text-sm uppercase focus:outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Số Seal</label>
                            <input id="inp-seal" type="text" placeholder="VD: SL-998877" class="w-full p-2.5 border rounded-lg text-sm uppercase focus:outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Cắt Máng / Giờ SI</label>
                            <input id="inp-cutoff" type="text" placeholder="VD: SI 10:00" class="w-full p-2.5 border border-rose-200 bg-rose-50 rounded-lg text-sm text-rose-700 font-bold focus:outline-none focus:ring-2 focus:ring-rose-500">
                        </div>
                    </div>
                </div>

                <!-- Section 2: Lộ Trình 3 Điểm -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="font-bold text-slate-700 mb-4 pb-2 border-b flex items-center font-heading">
                        <i class="ph-fill ph-map-pin text-teal-600 mr-2"></i> 2. Lộ Trình (Nơi Lấy - Đóng/Trả - Nơi Hạ)
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-teal-50/50 p-4 rounded-xl border border-teal-100">
                            <label class="text-sm font-bold text-teal-800 mb-2 block font-heading">1. Nơi Lấy (Cảng / Bãi)</label>
                            <input id="inp-pickup" type="text" placeholder="VD: SPITC, CÁT LÁI, TĐÁ..." class="w-full p-2.5 border rounded-md text-sm mb-2 uppercase focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium" required>
                        </div>
                        <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-100">
                            <label class="text-sm font-bold text-amber-800 mb-2 block font-heading">2. Nơi Đóng/Trả (Kho KH)</label>
                            <input id="inp-warehouse" type="text" placeholder="VD: MACSTAR TÂN VẠN, KHO WCA..." class="w-full p-2.5 border rounded-md text-sm mb-2 uppercase focus:outline-none focus:ring-2 focus:ring-amber-500 font-medium" required>
                        </div>
                        <div class="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                            <label class="text-sm font-bold text-emerald-800 mb-2 block font-heading">3. Nơi Hạ (Bãi Rỗng)</label>
                            <input id="inp-dropoff" type="text" placeholder="VD: SOLOG LIBRA, VSIP 3..." class="w-full p-2.5 border rounded-md text-sm mb-2 uppercase focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium">
                        </div>
                    </div>
                </div>

                <!-- Section 3: Phân công -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="font-bold text-slate-700 mb-4 pb-2 border-b flex items-center font-heading">
                        <i class="ph-fill ph-users text-teal-600 mr-2"></i> 3. Phân công & Ghi chú
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tài xế nhận lệnh <span class="text-rose-500">*</span></label>
                            <select id="inp-driver" class="w-full p-2.5 border rounded-lg text-sm font-bold text-slate-800 focus:ring-2 focus:ring-teal-500 focus:outline-none" required>
                                <option value="">-- Chọn tài xế --</option>
                                <option value="61S">61S (BỘT SẮT - 61S-999.00)</option>
                                <option value="BỤI 94">BỤI 94 (51C-123.45)</option>
                                <option value="LIBRA">LIBRA (51C-888.99)</option>
                                <option value="HÒA PHÁT">HÒA PHÁT (61C-393.29)</option>
                                <option value="3S">TÀI XẾ 3S (Xe tải 10T - 50E-745.02)</option>
                                <option value="HẢI ĐĂNG">HẢI ĐĂNG (Xe tải 2T - 50E-112.34)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Ghi chú phí Công ty chịu / Lưu ý Điều độ</label>
                            <input id="inp-notes" type="text" placeholder="VD: Xin trái tuyến Đồng An 320k TVL chịu, Free time 3 ngày..." class="w-full p-2.5 border border-amber-300 bg-amber-50 rounded-lg text-sm text-amber-900 font-medium focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>
                    </div>
                </div>
                
                <div class="p-4 border-t flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('modal-create-trip')" class="px-5 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 transition-colors">Hủy</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl font-bold text-white bg-teal-700 hover:bg-teal-800 shadow-md shadow-teal-900/20 flex items-center transition-all active:scale-95">
                        <i class="ph-fill ph-paper-plane-right mr-2 text-lg"></i> Lưu Vào DB & Phát Lệnh Zalo
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
