<!-- MODAL TẠO YÊU CẦU TẠM ỨNG QUỸ TỪ CTY CHO ĐIỀU VẬN (DISPATCHER ADVANCE FUND) -->
<div id="modal-dispatcher-fund" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto animate-fade-in">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden transform transition-all">
        <!-- Modal Header -->
        <div class="px-6 py-4 bg-indigo-800 text-white flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-indigo-700/80 flex items-center justify-center text-indigo-200">
                    <i class="ph-fill ph-wallet text-xl"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold font-heading">Tạo Quỹ Tạm Ứng Cho Điều Vận</h3>
                    <p class="text-xs text-indigo-200 font-medium">Công ty xuất quỹ tạm ứng cho bộ phận Điều phối Đội xe</p>
                </div>
            </div>
            <button onclick="closeDispatcherFundModal()" class="w-8 h-8 rounded-full bg-indigo-700/50 hover:bg-indigo-700 text-white flex items-center justify-center transition-colors">
                <i class="ph-bold ph-x text-sm"></i>
            </button>
        </div>

        <!-- Form Body -->
        <form id="form-dispatcher-fund" onsubmit="submitDispatcherFundForm(event)" class="p-6 space-y-4 text-xs font-medium text-slate-700">
            <!-- Nhân viên Điều vận nhận quỹ -->
            <div>
                <label class="block font-bold text-slate-800 mb-1">
                    Điều Phối Viên / Trưởng Đội Xe Nhận Quỹ <span class="text-rose-600">*</span>
                </label>
                <select id="fund-inp-dispatcher" required
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:bg-white focus:border-indigo-600 focus:ring-1 focus:ring-indigo-500">
                    <option value="">-- Chọn nhân viên điều phối nhận quỹ --</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <!-- Số tiền công ty cấp -->
                <div>
                    <label class="block font-bold text-slate-800 mb-1">
                        Số Tiền Tạm Ứng (VNĐ) <span class="text-rose-600">*</span>
                    </label>
                    <input type="text" id="fund-inp-amount" required placeholder="ví dụ: 20.000.000"
                        class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-black text-indigo-800 text-right tabular-nums focus:border-indigo-600 focus:ring-1 focus:ring-indigo-500 input-number-vn" />
                </div>

                <!-- Ngày tạm ứng -->
                <div>
                    <label class="block font-bold text-slate-800 mb-1">
                        Ngày Xuất Quỹ <span class="text-rose-600">*</span>
                    </label>
                    <input type="date" id="fund-inp-date" required
                        class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-500" />
                </div>
            </div>

            <!-- Mục đích quỹ -->
            <div>
                <label class="block font-bold text-slate-800 mb-1">Mục Đích Tạm Ứng Quỹ</label>
                <input type="text" id="fund-inp-purpose" value="Quỹ điều vận tạm ứng chuyến xe, vé BOT, nâng hạ & cược cont"
                    class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-500" />
            </div>

            <!-- Ghi chú thêm -->
            <div>
                <label class="block font-bold text-slate-800 mb-1">Ghi Chú Đề Xuất / Hình Thức Chi (CK / Tiền Mặt)</label>
                <textarea id="fund-inp-notes" rows="2" placeholder="Chuyển khoản vào tài khoản điều vận, số lệnh chuyển..."
                    class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-500"></textarea>
            </div>

            <!-- Footer Buttons -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2.5">
                <button type="button" onclick="closeDispatcherFundModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold font-heading transition-colors">
                    Hủy Bỏ
                </button>
                <button type="submit" id="btn-submit-dispatcher-fund" class="px-5 py-2 bg-indigo-700 hover:bg-indigo-800 text-white rounded-xl font-bold font-heading shadow-sm flex items-center gap-1.5 transition-all">
                    <i class="ph-bold ph-check text-sm"></i>
                    <span>Tạo Phiếu Tạm Ứng Quỹ</span>
                </button>
            </div>
        </form>
    </div>
</div>
