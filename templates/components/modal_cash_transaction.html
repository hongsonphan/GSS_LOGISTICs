<!-- MODAL LẬP PHIẾU THU / PHIẾU CHI VÀO SỔ QUỸ (CASH & BANK BOOK) -->
<div id="modal-cash-transaction" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs hidden p-4 animate-fade-in">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="px-6 py-4 bg-emerald-700 text-white flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-800/80 flex items-center justify-center text-lg">
                    <i class="ph-bold ph-bank" id="cash-modal-icon"></i>
                </div>
                <div>
                    <h3 class="font-bold text-base tracking-tight font-heading" id="cash-modal-title">Lập Phiếu Thu / Chi Sổ Quỹ</h3>
                    <p class="text-emerald-100 text-xs mt-0.5">Mẫu Sổ Quỹ S03a-DN • Hạch toán Quỹ Tiền Mặt & Ngân Hàng</p>
                </div>
            </div>
            <button onclick="closeCashTransactionModal()" class="text-emerald-200 hover:text-white p-1 rounded-lg hover:bg-emerald-600 transition-colors">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>

        <!-- Form Body -->
        <form id="form-cash-transaction" onsubmit="handleSaveCashTransaction(event)" class="p-5 md:p-6 space-y-3.5 text-xs font-semibold text-slate-700">
            <!-- 1. Loại giao dịch (Thu / Chi) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div>
                    <div class="flex items-center justify-between h-5 mb-1">
                        <label class="block font-bold text-slate-700 text-xs truncate">Loại Giao Dịch <span class="text-rose-500">*</span></label>
                    </div>
                    <select id="cash-tx-type" onchange="onCashTypeChange()" required class="form-select h-8.5 px-2.5 py-1 text-xs font-bold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 bg-white w-full">
                        <option value="INFLOW">Phiếu Thu (Tiền vào quỹ)</option>
                        <option value="OUTFLOW">Phiếu Chi (Tiền ra khỏi quỹ)</option>
                    </select>
                </div>
                <div>
                    <div class="flex items-center justify-between h-5 mb-1">
                        <label class="block font-bold text-slate-700 text-xs truncate">Hình Thức Thanh Toán <span class="text-rose-500">*</span></label>
                    </div>
                    <select id="cash-tx-method" onchange="onPaymentMethodChange()" required class="form-select h-8.5 px-2.5 py-1 text-xs font-bold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 bg-white w-full">
                        <option value="BANK">Tài khoản Ngân Hàng (Chuyển khoản)</option>
                        <option value="CASH">Quỹ Tiền Mặt (Tại công ty)</option>
                    </select>
                </div>
            </div>

            <!-- 2. Khoản mục dòng tiền -->
            <div>
                <div class="flex items-center justify-between h-5 mb-1">
                    <label class="block font-bold text-slate-700 text-xs truncate">Khoản Mục Thu / Chi <span class="text-rose-500">*</span></label>
                </div>
                <select id="cash-tx-category" required class="form-select h-8.5 px-2.5 py-1 text-xs font-bold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 bg-white w-full">
                    <!-- Populated by JS based on INFLOW/OUTFLOW -->
                </select>
            </div>

            <!-- 3. Số tiền & Ngày giao dịch -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div>
                    <div class="flex items-center justify-between h-5 mb-1">
                        <label class="block font-bold text-slate-700 text-xs truncate">Số Tiền Giao Dịch (VNĐ) <span class="text-rose-500">*</span></label>
                    </div>
                    <input type="text" id="cash-tx-amount" required placeholder="VD: 5.000.000"
                        class="form-input h-8.5 px-2.5 py-1 text-xs font-black text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 input-number-vn font-mono text-right w-full">
                </div>
                <div>
                    <div class="flex items-center justify-between h-5 mb-1">
                        <label class="block font-bold text-slate-700 text-xs truncate">Ngày Hạch Toán Sổ Quỹ <span class="text-rose-500">*</span></label>
                    </div>
                    <input type="date" id="cash-tx-date" required
                        class="form-input h-8.5 px-2.5 py-1 text-xs font-bold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 w-full">
                </div>
            </div>

            <!-- 4. Đối tượng Nộp / Nhận tiền -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div>
                    <div class="flex items-center justify-between h-5 mb-1">
                        <label class="block font-bold text-slate-700 text-xs truncate">Phân Loại Đối Tác</label>
                    </div>
                    <select id="cash-tx-partner-type" class="form-select h-8.5 px-2.5 py-1 text-xs font-semibold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 bg-white w-full">
                        <option value="">-- Tự do / Khác --</option>
                        <option value="CUSTOMER">Khách hàng</option>
                        <option value="DRIVER">Tài xế</option>
                        <option value="DISPATCHER">Điều phối viên</option>
                        <option value="SUBCONTRACTOR">Nhà xe bạn / Thầu phụ</option>
                        <option value="VENDOR">Nhà cung cấp / Trạm BOT / Gara</option>
                        <option value="INTERNAL">Nội bộ công ty</option>
                    </select>
                </div>
                <div>
                    <div class="flex items-center justify-between h-5 mb-1">
                        <label class="block font-bold text-slate-700 text-xs truncate">Tên Đối Tác Nộp / Nhận Tiền</label>
                    </div>
                    <input type="text" id="cash-tx-partner-name" placeholder="VD: CÔNG TY ABC, Bác tài Hùng..."
                        class="form-input h-8.5 px-2.5 py-1 text-xs font-semibold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 w-full">
                </div>
            </div>

            <!-- 5. Tham chiếu & Ngân hàng -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="cash-bank-fields">
                <div>
                    <div class="flex items-center justify-between h-5 mb-1">
                        <label class="block font-bold text-slate-700 text-xs truncate">Mã Tham Chiếu / Chứng Từ Gốc</label>
                    </div>
                    <input type="text" id="cash-tx-ref" placeholder="VD: TVL-2026-001, DN-2026-01, HĐ..."
                        class="form-input h-8.5 px-2.5 py-1 text-xs font-semibold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 uppercase w-full">
                </div>
                <div>
                    <div class="flex items-center justify-between h-5 mb-1">
                        <label class="block font-bold text-slate-700 text-xs truncate">Tên & STK Ngân Hàng</label>
                    </div>
                    <input type="text" id="cash-tx-bank" placeholder="VD: Vietcombank - 007100..."
                        class="form-input h-8.5 px-2.5 py-1 text-xs font-semibold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 w-full">
                </div>
            </div>

            <!-- 6. Diễn giải -->
            <div>
                <div class="flex items-center justify-between h-5 mb-1">
                    <label class="block font-bold text-slate-700 text-xs truncate">Diễn Giải Lý Do Thu / Chi</label>
                </div>
                <textarea id="cash-tx-notes" rows="2" placeholder="Ghi chú rõ ràng lý do thu chi để phục vụ đối soát kiểm toán..."
                    class="form-textarea p-2.5 border border-slate-200 rounded-lg text-xs font-semibold text-slate-800 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-500 w-full"></textarea>
            </div>

            <!-- Buttons -->
            <div class="pt-3 border-t border-slate-100 flex justify-end space-x-2.5">
                <button type="button" onclick="closeCashTransactionModal()" class="px-4 py-1.5 border border-slate-200 hover:bg-slate-100 text-slate-600 rounded-xl text-xs font-bold font-heading transition-colors cursor-pointer">
                    Hủy Bỏ
                </button>
                <button type="submit" id="btn-save-cash-tx" class="px-5 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-bold font-heading shadow-xs flex items-center gap-1.5 transition-all cursor-pointer">
                    <i class="ph-bold ph-check text-sm"></i>
                    <span>Lưu</span>
                </button>
            </div>
        </form>
    </div>
</div>
