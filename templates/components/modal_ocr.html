<!-- MODAL CẬP NHẬT HÓA ĐƠN & CHỨNG TỪ VẬN TẢI (PRODUCTION ENTERPRISE) -->
<div id="modal-ocr" class="fixed inset-0 bg-slate-900/70 z-50 hidden-view flex items-center justify-center p-4 backdrop-blur-xs">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col animate-slide-up border border-slate-200">
        <!-- Header -->
        <div class="flex justify-between items-center px-5 py-3.5 border-b border-slate-200 bg-slate-50/90">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-teal-50 border border-teal-200 text-teal-700 flex items-center justify-center">
                    <i class="ph-bold ph-receipt text-lg"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 text-sm font-heading" id="ocr-modal-title">
                        Cập Nhật Hóa Đơn & Chứng Từ Vận Tải
                    </h3>
                    <p class="text-[11px] text-slate-500 font-medium" id="ocr-upload-sub">
                        Đính kèm hóa đơn điện tử, phiếu EIR hoặc biên bản POD nghiệm thu
                    </p>
                </div>
            </div>
            <button type="button" onclick="closeModal('modal-ocr')" class="p-1.5 hover:bg-slate-200 rounded-lg text-slate-400 hover:text-slate-700 transition-colors cursor-pointer">
                <i class="ph-bold ph-x text-base"></i>
            </button>
        </div>

        <div class="p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <!-- Chuyển đổi chế độ (Kê Chi Phí / Trả Chứng Từ) -->
            <div class="flex p-1 bg-slate-100 rounded-xl gap-1 text-xs font-bold font-heading">
                <button type="button" id="tab-ocr-mode-expense" onclick="switchOcrFormMode('phi-ton')" 
                    class="flex-1 py-2 px-3 rounded-lg transition-all text-center flex items-center justify-center gap-1.5 bg-white text-teal-800 shadow-2xs">
                    <i class="ph-bold ph-money text-sm"></i>
                    <span>Chi Phí Phát Sinh</span>
                </button>
                <button type="button" id="tab-ocr-mode-doc" onclick="switchOcrFormMode('chung-tu')" 
                    class="flex-1 py-2 px-3 rounded-lg transition-all text-center flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900">
                    <i class="ph-bold ph-file-text text-sm"></i>
                    <span>Chứng Từ Nghiệm Thu (EIR / POD)</span>
                </button>
            </div>

            <!-- Khu Vực Tải Tệp / Đính Kèm Ảnh Chứng Từ Thực Tế -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1 font-heading">
                    Ảnh chụp / Tệp Hóa Đơn Điện Tử (PDF, JPG, PNG)
                </label>
                <div id="ocr-dropzone" onclick="document.getElementById('ocr-file-input').click()" 
                    class="border-2 border-dashed border-teal-300 hover:border-teal-500 bg-teal-50/40 hover:bg-teal-50/80 rounded-xl p-4 flex flex-col items-center justify-center text-slate-600 cursor-pointer transition-colors group">
                    <input type="file" id="ocr-file-input" class="hidden" accept="image/*,application/pdf" onchange="handleOcrFileSelected(this)">
                    <div class="w-10 h-10 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
                        <i class="ph-bold ph-cloud-arrow-up text-xl"></i>
                    </div>
                    <p class="text-xs font-bold text-slate-800 font-heading text-center" id="ocr-upload-text">
                        Bấm để chọn tệp hoặc kéo thả vào đây
                    </p>
                    <p class="text-[11px] text-slate-500 mt-0.5 text-center" id="ocr-file-name-preview">
                        Hỗ trợ ảnh biên lai, hóa đơn điện tử cảng hoặc PDF
                    </p>
                </div>

                <!-- Nút dán nhanh từ clipboard -->
                <button type="button" onclick="pasteImageFromClipboard('ocr')" 
                    class="w-full mt-2 py-1.5 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 flex items-center justify-center gap-1.5 transition-colors cursor-pointer" 
                    title="Dán ảnh chụp màn hình từ Clipboard (Ctrl+V)">
                    <i class="ph-bold ph-clipboard-text text-teal-700 text-sm"></i>
                    <span>Dán ảnh từ Clipboard (Ctrl + V)</span>
                </button>
            </div>

            <!-- Preview tệp đã chọn -->
            <div id="ocr-preview-container" class="hidden p-2.5 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                    <i class="ph-bold ph-file-pdf text-rose-600 text-xl shrink-0" id="ocr-preview-icon"></i>
                    <div class="min-w-0">
                        <p class="text-xs font-bold text-slate-800 truncate" id="ocr-preview-filename">file.pdf</p>
                        <p class="text-[10px] text-slate-500" id="ocr-preview-filesize">0 KB</p>
                    </div>
                </div>
                <button type="button" onclick="clearOcrSelectedFile()" class="p-1 hover:bg-rose-50 text-slate-400 hover:text-rose-600 rounded transition-colors" title="Bỏ chọn tệp">
                    <i class="ph-bold ph-trash text-sm"></i>
                </button>
            </div>

            <!-- FORM 1: CHI PHÍ PHÁT SINH -->
            <div id="ocr-form-expense" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1 font-heading">
                            Khoản mục chi phí <span class="text-rose-500">*</span>
                        </label>
                        <select id="ocr-expense-type" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500">
                            <option value="TOLL_FEE" selected>Vé cầu đường (Trạm BOT / ePass)</option>
                            <option value="LIFT_ON">Phí nâng cont rỗng / hàng</option>
                            <option value="LIFT_OFF">Phí hạ cont tại cảng / ICD</option>
                            <option value="CONTAINER_DEPOSIT">Cược vỏ container hãng tàu</option>
                            <option value="WEIGHING">Cân xe tải trọng / VGM</option>
                            <option value="LABOR_STEVEDORING">Bốc xếp hàng hóa / đóng rút</option>
                            <option value="OTHER">Chi phí khác (Lưu ca, vá vỏ...)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1 font-heading">
                            Số tiền thực chi (VNĐ) <span class="text-rose-500">*</span>
                        </label>
                        <input id="ocr-amount" type="text" inputmode="numeric" placeholder="VD: 120.000" 
                            class="input-number-vn w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-black text-rose-600 text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">
                            Số Hóa Đơn / Biên Lai
                        </label>
                        <input id="ocr-expense-inv-no" type="text" placeholder="VD: 0045123" 
                            class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono text-slate-800 focus:outline-none focus:ring-1 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">
                            Mã Tra Cứu HĐĐT
                        </label>
                        <input id="ocr-expense-lookup-code" type="text" placeholder="VD: TC-2026-99" 
                            class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono text-slate-800 focus:outline-none focus:ring-1 focus:ring-teal-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">
                        Ghi chú diễn giải
                    </label>
                    <input id="ocr-expense-notes" type="text" placeholder="Ghi chú chi tiết cho kế toán đối soát..." 
                        class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-teal-500">
                </div>
            </div>

            <!-- FORM 2: CHỨNG TỪ NGHIỆM THU (EIR / POD) -->
            <div id="ocr-form-document" class="space-y-3 hidden-view">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1 font-heading">
                        Loại Chứng Từ Nghiệm Thu <span class="text-rose-500">*</span>
                    </label>
                    <select id="ocr-doc-type" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="Phiếu EIR Hạ Cont" selected>Phiếu EIR Giao Nhận / Hạ Cont</option>
                        <option value="Biên bản giao nhận hàng">Biên bản giao nhận có chữ ký (POD)</option>
                        <option value="Phiếu cân xe">Phiếu cân xe tải trọng</option>
                        <option value="Hóa đơn GTGT">Hóa đơn GTGT dịch vụ cảng</option>
                        <option value="Ảnh hiện trường">Ảnh hiện trường / Giám định vỏ cont</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1 font-heading">
                            Số Cont
                        </label>
                        <input id="ocr-doc-cont" type="text" placeholder="VD: CAAU521421" 
                            class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold font-mono text-slate-800 text-xs uppercase focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1 font-heading">
                            Số Chì (Seal)
                        </label>
                        <input id="ocr-doc-seal" type="text" placeholder="VD: ML-998811" 
                            class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold font-mono text-slate-800 text-xs uppercase focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2.5">
            <button type="button" onclick="closeModal('modal-ocr')" 
                class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition-colors cursor-pointer">
                Hủy Bỏ
            </button>
            <button type="button" id="btn-submit-ocr" onclick="submitOcrData()" 
                class="px-5 py-2 font-bold rounded-xl shadow-xs text-white bg-teal-700 hover:bg-teal-800 flex items-center gap-1.5 text-xs font-heading transition-all cursor-pointer">
                <i class="ph-bold ph-check-circle text-base"></i>
                <span id="btn-submit-ocr-text">Lưu & Đính Kèm</span>
            </button>
        </div>
    </div>
</div>
