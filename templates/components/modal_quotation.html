<!-- MODAL TẠO & HIỆU CHỈNH BÁO GIÁ TUYẾN CƯỚC (CRM / SALES) -->
<div id="modal-quotation" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden-view p-4 animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col border border-slate-100 max-h-[92vh]">
        
        <!-- Modal Header -->
        <div class="bg-gradient-to-r from-indigo-700 to-indigo-800 p-5 text-white flex justify-between items-center shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl backdrop-blur-xs">
                    <i class="ph-fill ph-handshake text-indigo-200"></i>
                </div>
                <div>
                    <h3 id="modal-quotation-title" class="font-black font-heading text-lg tracking-tight">Thêm Báo Giá Tuyến Cước Mới</h3>
                    <p class="text-xs text-indigo-200 font-medium mt-0.5">Phễu bán hàng & thỏa thuận thương mại dành cho Nhân viên Kinh doanh (Sales / BD)</p>
                </div>
            </div>
            <button onclick="closeModal('modal-quotation')" class="text-white/80 hover:text-white p-2 rounded-lg hover:bg-white/10 transition-colors">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <!-- Modal Body Form -->
        <form id="form-quotation" onsubmit="saveQuotation(event); return false;" novalidate class="p-6 overflow-y-auto space-y-5 flex-1 text-sm">
            <input type="hidden" id="quote-id" value="">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Tên Khách Hàng (Tìm Kiếm + Chọn Danh Mục + Nút Thêm Nhanh) -->
                <div class="md:col-span-2">
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block font-bold text-slate-700 uppercase tracking-wider text-xs">
                            Tên Khách Hàng / Đối Tác <span class="text-rose-600">*</span>
                        </label>
                        <button type="button" onclick="openMasterDataModalQuick('customers', 'quote-customer')" 
                            class="text-xs font-bold text-indigo-700 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-lg border border-indigo-200 flex items-center gap-1 transition-colors">
                            <i class="ph-bold ph-plus"></i> Thêm Khách Hàng
                        </button>
                    </div>
                    <div class="space-y-1.5">
                        <div class="relative">
                            <i class="ph ph-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="text" id="quote-customer-search" oninput="filterCustomerSelectOptions('quote-customer-search', 'quote-customer')" 
                                placeholder="🔍 Gõ tìm nhanh tên khách hàng / MST / mã KH..." 
                                class="w-full pl-9 pr-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 text-xs text-slate-800 transition-all font-medium mb-1.5">
                        </div>
                        <select id="quote-customer" required 
                            class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 font-bold text-slate-900 text-sm transition-all">
                            <option value="">-- Chọn Khách Hàng Trong Danh Mục --</option>
                        </select>
                    </div>
                </div>

                <!-- Tuyến Đường Vận Chuyển & 2 Khu Vực + Số KM Ước Tính -->
                <div class="md:col-span-2 space-y-3">
                    <div class="flex items-center justify-between mb-1">
                        <label class="block font-bold text-slate-700 uppercase tracking-wider text-xs">
                            Tuyến Đường & Cụm 2 Khu Vực Vận Chuyển <span class="text-rose-600">*</span>
                        </label>
                        <button type="button" onclick="openMasterDataModalQuick('driver_tariffs', 'quote-route')" 
                            class="text-xs font-bold text-indigo-700 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-lg border border-indigo-200 flex items-center gap-1 transition-colors">
                            <i class="ph-bold ph-plus"></i> Thêm Tuyến Danh Mục
                        </button>
                    </div>

                    <!-- 2 Cụm Khu Vực (Đi & Đến) + Tuyến Mẫu -->
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 bg-indigo-50/40 p-3 rounded-xl border border-indigo-100">
                        <div class="sm:col-span-4">
                            <label class="block text-[11px] font-bold text-indigo-950 uppercase mb-1">1. Khu Vực Đi / Lấy Cont</label>
                            <select id="quote-origin-zone" onchange="onQuoteZonesChanged()" 
                                class="w-full px-2.5 py-2 bg-white border border-indigo-200 rounded-lg text-xs font-bold text-indigo-900 focus:ring-2 focus:ring-indigo-200">
                                <option value="">-- Chọn Khu Vực Đi --</option>
                                <option value="Cát Lái (TP.HCM)">Cát Lái (TP.HCM)</option>
                                <option value="Cái Mép (Vũng Tàu)">Cái Mép (Vũng Tàu)</option>
                                <option value="Hiệp Phước (Nhà Bè)">Hiệp Phước (Nhà Bè)</option>
                                <option value="SPITC / Phú Hữu">SPITC / Phú Hữu</option>
                                <option value="Sóng Thần / Dĩ An">Sóng Thần / Dĩ An</option>
                                <option value="Bãi Triền Võ (TVL)">Bãi Triền Võ (TVL)</option>
                                <option value="Khu Vực Khác">Khu Vực Khác</option>
                            </select>
                        </div>

                        <div class="sm:col-span-4">
                            <label class="block text-[11px] font-bold text-indigo-950 uppercase mb-1">2. Khu Vực Đến / Kho Khách</label>
                            <select id="quote-dest-zone" onchange="onQuoteZonesChanged()" 
                                class="w-full px-2.5 py-2 bg-white border border-indigo-200 rounded-lg text-xs font-bold text-indigo-900 focus:ring-2 focus:ring-indigo-200">
                                <option value="">-- Chọn Khu Vực Đến --</option>
                                <option value="Bình Dương (VSIP/Bàu Bàng/Mỹ Phước)">Bình Dương (VSIP/Bàu Bàng...)</option>
                                <option value="Đồng Nai (Biên Hòa/Nhơn Trạch/Long Thành)">Đồng Nai (Biên Hòa/Nhơn Trạch...)</option>
                                <option value="Tây Ninh (Trảng Bàng/Phước Đông)">Tây Ninh (Trảng Bàng/Phước Đông)</option>
                                <option value="Long An (Bến Lức/Đức Hòa/Tân An)">Long An (Bến Lức/Đức Hòa...)</option>
                                <option value="Củ Chi / Hóc Môn / TP.HCM">Củ Chi / Hóc Môn / TP.HCM</option>
                                <option value="Vũng Tàu / Phú Mỹ">Vũng Tàu / Phú Mỹ</option>
                                <option value="Khu Vực Khác">Khu Vực Khác</option>
                            </select>
                        </div>

                        <div class="sm:col-span-4">
                            <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Tuyến Mẫu Có Sẵn</label>
                            <select id="quote-route-preset" onchange="onQuoteRoutePresetChanged(this.value)" 
                                class="w-full px-2.5 py-2 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-200">
                                <option value="">-- Chọn Tuyến Mẫu --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Tên Tuyến Chi Tiết & Số KM Ước Tính (Bước 10km) -->
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
                        <div class="sm:col-span-8">
                            <label class="block font-bold text-slate-700 text-xs uppercase mb-1">Mô Tả Tuyến Đường Chi Tiết <span class="text-rose-600">*</span></label>
                            <input type="text" id="quote-route" required placeholder="VD: CÁT LÁI ➔ KCN VSIP 2 BÌNH DƯƠNG" 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-600 font-bold text-slate-900 text-sm">
                        </div>

                        <div class="sm:col-span-4">
                            <div class="flex items-center justify-between mb-1">
                                <label class="block font-bold text-slate-700 text-xs uppercase" title="Khoảng cách làm tròn chênh nhau 10km">Cự Ly Ước Tính</label>
                                <span class="text-[10px] text-indigo-700 font-bold bg-indigo-50 px-1 py-0.2 rounded border border-indigo-200">Bước 10km</span>
                            </div>
                            <div class="relative">
                                <input type="number" id="quote-estimated-km" step="10" min="0" value="30" onchange="roundEstimatedKmInput(this)"
                                    class="w-full h-10 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-600 font-black text-indigo-900 text-sm text-center tabular-nums">
                                <span class="absolute right-2.5 top-2.5 text-slate-400 font-bold text-xs pointer-events-none">KM</span>
                            </div>
                        </div>
                    </div>

                    <!-- Quick KM buttons -->
                    <div class="flex items-center gap-1 text-[11px] text-slate-500 flex-wrap">
                        <span class="font-medium text-slate-400">Chọn nhanh cự ly:</span>
                        <button type="button" onclick="setQuoteKm(10)" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-100 hover:text-indigo-800 font-bold transition-colors">10 km</button>
                        <button type="button" onclick="setQuoteKm(20)" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-100 hover:text-indigo-800 font-bold transition-colors">20 km</button>
                        <button type="button" onclick="setQuoteKm(30)" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-100 hover:text-indigo-800 font-bold transition-colors">30 km</button>
                        <button type="button" onclick="setQuoteKm(40)" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-100 hover:text-indigo-800 font-bold transition-colors">40 km</button>
                        <button type="button" onclick="setQuoteKm(50)" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-100 hover:text-indigo-800 font-bold transition-colors">50 km</button>
                        <button type="button" onclick="setQuoteKm(70)" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-100 hover:text-indigo-800 font-bold transition-colors">70 km</button>
                        <button type="button" onclick="setQuoteKm(100)" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-100 hover:text-indigo-800 font-bold transition-colors">100 km</button>
                    </div>
                </div>

                <!-- Đơn Giá Cước -->
                <div>
                    <label class="block font-bold text-slate-700 mb-1.5 uppercase tracking-wider text-xs">
                        Đơn Giá Cước Đề Xuất (VNĐ) <span class="text-rose-600">*</span>
                    </label>
                    <div class="relative">
                        <input type="text" inputmode="numeric" id="quote-unit-price" required value="3.800.000" placeholder="VD: 3.800.000" oninput="calculateQuoteExpectedRevenue()"
                            class="input-number-vn w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 font-black text-indigo-700 text-sm tabular-nums transition-all pr-12">
                        <span class="absolute right-3 top-2.5 text-slate-400 font-bold text-xs pointer-events-none">VNĐ</span>
                    </div>
                </div>

                <!-- Sản Lượng Dự Kiến -->
                <div>
                    <label class="block font-bold text-slate-700 mb-1.5 uppercase tracking-wider text-xs">
                        Sản Lượng Cam Kết (Chuyến/Tháng) <span class="text-rose-600">*</span>
                    </label>
                    <div class="relative">
                        <input type="text" inputmode="numeric" id="quote-monthly-trips" required value="20" placeholder="VD: 20" oninput="calculateQuoteExpectedRevenue()"
                            class="input-number-vn w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 font-black text-slate-800 text-sm tabular-nums transition-all pr-24">
                        <span class="absolute right-3 top-2.5 text-slate-400 font-bold text-xs pointer-events-none">chuyến/tháng</span>
                    </div>
                </div>

                <!-- Tự Động Tính Doanh Thu Kế Hoạch -->
                <div class="md:col-span-2 bg-indigo-50/60 p-4 rounded-xl border border-indigo-100 flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold text-indigo-700 uppercase tracking-wider">Doanh Thu Kế Hoạch / Tháng (Tạm tính)</span>
                        <p class="text-xs text-slate-500 font-medium">Bằng: Đơn giá cước × Sản lượng cam kết hàng tháng</p>
                    </div>
                    <div class="text-right">
                        <span id="quote-preview-revenue" class="text-2xl font-black text-indigo-900 tabular-nums font-heading">76.000.000 đ</span>
                    </div>
                </div>

                <!-- Trạng Thái Ban Đầu -->
                <div class="md:col-span-2">
                    <label class="block font-bold text-slate-700 mb-1.5 uppercase tracking-wider text-xs">
                        Giai Đoạn Chu Trình Báo Giá (Sales Funnel) <span class="text-rose-600">*</span>
                    </label>
                    <select id="quote-status" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 font-bold text-slate-800 text-sm transition-all">
                        <option value="NEGOTIATING">1. Đang thương lượng (Chờ khách chốt đơn giá)</option>
                        <option value="PENDING_APPROVAL">2. Chờ Ban Giám Đốc duyệt (Trình BGĐ duyệt giá cước / chiết khấu)</option>
                        <option value="APPROVED">3. Đã duyệt (Khách đồng ý & Ký kết hợp đồng thương mại)</option>
                        <option value="REJECTED">4. Từ chối / Không chốt (Khách hủy hoặc không đạt thỏa thuận)</option>
                        <option value="EXPIRED">5. Hết hiệu lực</option>
                    </select>
                </div>
            </div>

            <!-- Modal Footer Buttons -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-2.5">
                <button type="button" onclick="closeModal('modal-quotation')" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 font-bold text-sm transition-all">
                    Đóng
                </button>
                <button type="button" id="btn-submit-quote" onclick="saveQuotation(event)" class="px-6 py-2.5 bg-indigo-700 hover:bg-indigo-800 text-white rounded-xl font-bold font-heading text-sm shadow-md transition-all flex items-center gap-1.5 cursor-pointer">
                    <i class="ph-fill ph-check-circle text-base"></i>
                    <span id="btn-save-quote-text">Lưu Báo Giá</span>
                </button>
            </div>
        </form>

    </div>
</div>
