<!-- MODAL KHAI BÁO & CẬP NHẬT HỒ SƠ NHÂN SỰ (EMPLOYEE MODAL) -->
<div id="modal-employee" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
        <!-- Header -->
        <div class="bg-gradient-to-r from-teal-800 to-teal-950 text-white px-5 py-3.5 flex items-center justify-between border-b border-teal-700">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-teal-600/50 flex items-center justify-center text-teal-200 border border-teal-400/30">
                    <i id="emp-modal-icon" class="ph-bold ph-user-plus text-base"></i>
                </div>
                <div>
                    <h3 id="emp-modal-title" class="text-sm font-black font-heading leading-tight tracking-tight">Khai Báo Nhân Sự Mới</h3>
                    <p id="emp-modal-subtitle" class="text-[11px] text-teal-300 font-medium">Hồ sơ cán bộ nhân viên & Đội ngũ tài xế</p>
                </div>
            </div>
            <button onclick="closeEmployeeModal()" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                <i class="ph-bold ph-x text-base"></i>
            </button>
        </div>

        <!-- Form Body -->
        <form id="form-employee" onsubmit="submitEmployeeForm(event)" class="p-4 md:p-5 space-y-3.5 max-h-[80vh] overflow-y-auto">
            <input type="hidden" id="emp-edit-id" value="">

            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                <!-- 1. Mã NV -->
                <div class="md:col-span-4">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Mã Nhân Viên <span class="text-rose-500">*</span></label>
                    <input type="text" id="emp-code" required placeholder="VD: TX012, DD002..."
                           class="w-full h-8.5 px-2.5 py-1 text-xs font-mono font-bold uppercase border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                </div>

                <!-- 2. Họ và tên -->
                <div class="md:col-span-8">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Họ Và Tên Đầy Đủ <span class="text-rose-500">*</span></label>
                    <input type="text" id="emp-full-name" required placeholder="VD: Nguyễn Văn An"
                           class="w-full h-8.5 px-2.5 py-1 text-xs font-bold border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                </div>

                <!-- 3. Biệt danh hiện trường -->
                <div class="md:col-span-4">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Biệt Danh (Nickname)</label>
                    <input type="text" id="emp-nickname" placeholder="VD: BỤI 94, LIBRA..."
                           class="w-full h-8.5 px-2.5 py-1 text-xs font-medium border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                </div>

                <!-- 4. Số điện thoại -->
                <div class="md:col-span-4">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Số Điện Thoại <span class="text-rose-500">*</span></label>
                    <input type="tel" id="emp-phone" required placeholder="0901234567"
                           class="w-full h-8.5 px-2.5 py-1 text-xs font-mono font-bold border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                </div>

                <!-- 5. Zalo ID / SĐT Zalo -->
                <div class="md:col-span-4">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Số Zalo Liên Lạc</label>
                    <input type="text" id="emp-zalo" placeholder="0901234567"
                           class="w-full h-8.5 px-2.5 py-1 text-xs font-medium border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                </div>

                <!-- 6. Phòng ban -->
                <div class="md:col-span-6">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Phòng Ban <span class="text-rose-500">*</span></label>
                    <select id="emp-department" required class="w-full h-8.5 px-2.5 py-1 text-xs font-bold border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                        <option value="FLEET">Đội Xe & Bãi (FLEET)</option>
                        <option value="DISPATCH">Phòng Điều Vận (DISPATCH)</option>
                        <option value="ACCOUNTING">Kế Toán Tài Chính (ACCOUNTING)</option>
                        <option value="SALES">Phòng Kinh Doanh (SALES)</option>
                        <option value="CUSTOMS">Thủ Tục Hải Quan (CUSTOMS)</option>
                        <option value="HR">Hành Chính Nhân Sự (HR)</option>
                        <option value="MANAGEMENT">Ban Giám Đốc (MANAGEMENT)</option>
                    </select>
                </div>

                <!-- 7. Chức vụ / Vai trò -->
                <div class="md:col-span-6">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Chức Vụ / Vai Trò <span class="text-rose-500">*</span></label>
                    <select id="emp-role" required onchange="handleEmployeeRoleChange()" class="w-full h-8.5 px-2.5 py-1 text-xs font-bold border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                        <option value="DRIVER">Tài xế (DRIVER)</option>
                        <option value="DISPATCHER">Điều độ viên (DISPATCHER)</option>
                        <option value="ACCOUNTANT">Kế toán viên (ACCOUNTANT)</option>
                        <option value="SALESMAN">Nhân viên Kinh doanh (SALESMAN)</option>
                        <option value="MECHANIC">Kỹ thuật viên bãi xe (MECHANIC)</option>
                        <option value="DIRECTOR">Ban Giám Đốc (DIRECTOR)</option>
                    </select>
                </div>

                <!-- 8. Chuyên môn tài xế (GPLX & Hạn bằng) -->
                <div id="emp-driver-fields" class="md:col-span-12 grid grid-cols-1 md:grid-cols-2 gap-3 p-3 bg-teal-50/50 rounded-xl border border-teal-100">
                    <div>
                        <label class="block font-bold text-teal-900 text-xs mb-1">Số Giấy Phép Lái Xe (GPLX)</label>
                        <input type="text" id="emp-license-number" placeholder="Số bằng lái hạng C, FC, FE..."
                               class="w-full h-8.5 px-2.5 py-1 text-xs font-mono font-bold border border-teal-200 rounded-lg bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                    </div>
                    <div>
                        <label class="block font-bold text-teal-900 text-xs mb-1">Ngày Hết Hạn Bằng Lái</label>
                        <input type="date" id="emp-license-expiry"
                               class="w-full h-8.5 px-2.5 py-1 text-xs font-mono border border-teal-200 rounded-lg bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                    </div>
                </div>

                <!-- 9. Mức Lương Cơ Bản -->
                <div class="md:col-span-6">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Mức Lương Cơ Bản (VNĐ)</label>
                    <input type="text" id="emp-base-salary" placeholder="5,000,000"
                           class="w-full h-8.5 px-2.5 py-1 text-xs font-mono font-bold text-right border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                </div>

                <!-- 10. Trạng thái hoạt động -->
                <div class="md:col-span-6">
                    <label class="block font-bold text-slate-700 text-xs mb-1">Trạng Thái Công Tác</label>
                    <select id="emp-is-active" class="w-full h-8.5 px-2.5 py-1 text-xs font-bold border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-hidden">
                        <option value="true">Đang làm việc (ACTIVE)</option>
                        <option value="false">Tạm ngưng / Nghỉ phép (INACTIVE)</option>
                    </select>
                </div>
            </div>

            <!-- Footer Actions -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2.5">
                <button type="button" onclick="closeEmployeeModal()" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold font-heading transition-colors cursor-pointer">
                    Hủy Bỏ
                </button>
                <button type="submit" id="emp-submit-btn" class="px-4 py-1.5 bg-teal-700 hover:bg-teal-800 text-white rounded-lg text-xs font-bold font-heading shadow-xs flex items-center space-x-1.5 transition-colors cursor-pointer">
                    <i class="ph-bold ph-check text-sm"></i>
                    <span>Lưu Hồ Sơ</span>
                </button>
            </div>
        </form>
    </div>
</div>
