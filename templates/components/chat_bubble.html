<!-- ======================================================== -->
<!-- COMPONENT: CHAT BUBBLE & FLOATING TEAM CHAT WINDOW         -->
<!-- Kế thừa tiêu chuẩn quốc tế từ Bim Ecosystem                -->
<!-- ======================================================== -->
<div id="chat-bubble-container" class="fixed bottom-6 right-6 z-50 select-none">
    <!-- Nút Nổi Chat Bubble -->
    <button type="button" id="chat-bubble-btn" onclick="toggleChatWindow()" class="bg-teal-700 hover:bg-teal-800 text-white rounded-full w-14 h-14 flex items-center justify-center shadow-2xl transition-transform hover:scale-105 active:scale-95 relative border-2 border-white">
        <i class="ph-bold ph-chats-circle text-2xl"></i>
        <!-- Huy hiệu tin nhắn chưa đọc -->
        <span id="chat-unread-badge" class="hidden absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full border-2 border-white shadow-md animate-pulse">0</span>
    </button>

    <!-- Cửa Sổ Chat Nổi (Floating Chat Drawer - Chuẩn Bim Ecosystem) -->
    <div id="chat-floating-window" style="bottom: 72px; right: 0;" class="hidden absolute right-0 w-[360px] sm:w-[420px] h-[520px] max-h-[calc(100vh-100px)] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden transition-all duration-200 origin-bottom-right">
        
        <!-- HEADER CỬA SỔ CHAT -->
        <div class="bg-teal-800 px-4 py-3 flex justify-between items-center text-white shrink-0 shadow-xs">
            <div class="flex items-center gap-2">
                <button type="button" id="chat-btn-back-rooms" onclick="showChatRoomsList()" class="hidden p-1 hover:bg-teal-700 rounded-lg transition-colors mr-0.5">
                    <i class="ph-bold ph-arrow-left text-base"></i>
                </button>
                <div class="w-7 h-7 rounded-lg bg-teal-700/80 flex items-center justify-center text-teal-200">
                    <i class="ph-bold ph-chats text-base"></i>
                </div>
                <div>
                    <h4 id="chat-header-title" class="font-bold text-xs uppercase tracking-wide truncate max-w-[220px]">Trò Chuyện Nội Bộ</h4>
                    <p id="chat-header-subtitle" class="text-[10.5px] text-teal-200 truncate">Văn phòng Triền Võ Logistics</p>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button type="button" onclick="toggleChatWindow()" class="p-1 hover:bg-teal-700 rounded-lg text-teal-200 hover:text-white transition-colors" title="Thu nhỏ">
                    <i class="ph-bold ph-x text-lg"></i>
                </button>
            </div>
        </div>

        <!-- VIEW 1: DANH SÁCH CÁC KÊNH & CUỘC TRÒ CHUYỆN -->
        <div id="chat-rooms-view" class="flex-1 flex flex-col overflow-hidden bg-slate-50">
            <!-- Nút tạo chat 1-1 nhanh -->
            <div class="p-3 bg-white border-b border-slate-100 flex items-center justify-between gap-2 shrink-0">
                <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Kênh & Trò chuyện</span>
                <button type="button" onclick="toggleChatDirectoryDropdown()" class="px-2.5 py-1 bg-teal-50 hover:bg-teal-100 text-teal-800 rounded-lg text-xs font-bold transition-colors inline-flex items-center gap-1 border border-teal-200">
                    <i class="ph-bold ph-user-plus text-xs"></i>
                    <span>Nhắn tin mới</span>
                </button>
            </div>

            <!-- Dropdown chọn nhân viên chat 1-1 -->
            <div id="chat-directory-dropdown" class="hidden p-2 bg-teal-50/90 border-b border-teal-200 shrink-0">
                <p class="text-[10px] font-bold text-teal-800 uppercase mb-1">Chọn đồng nghiệp để nhắn tin:</p>
                <select id="chat-select-colleague" onchange="startDirectChat(this.value)" class="w-full bg-white border border-teal-300 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 outline-none">
                    <option value="">-- Chọn nhân sự văn phòng --</option>
                </select>
            </div>

            <!-- Danh sách các phòng -->
            <div id="chat-rooms-list" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
                <div class="text-center py-8 text-xs text-slate-400">Đang tải danh sách kênh...</div>
            </div>
        </div>

        <!-- VIEW 2: MÀN HÌNH TIN NHẮN TRONG PHÒNG -->
        <div id="chat-messages-view" class="hidden flex-1 flex flex-col overflow-hidden bg-slate-100">
            <!-- Khu vực cuộn tin nhắn -->
            <div id="chat-messages-scroll" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar flex flex-col">
                <div class="text-center py-4 text-xs text-slate-400">Đang tải tin nhắn...</div>
            </div>

            <!-- Preview tệp đính kèm trước khi gửi -->
            <div id="chat-pending-files-preview" class="hidden px-3 py-1.5 bg-slate-200 border-t border-slate-300 text-xs text-slate-700 flex items-center justify-between">
                <span id="chat-pending-files-text" class="truncate font-semibold"></span>
                <button type="button" onclick="clearPendingChatFiles()" class="text-rose-600 hover:text-rose-800 p-0.5">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>

            <!-- Form Nhập Tin Nhắn -->
            <div class="p-2.5 bg-white border-t border-slate-200 shrink-0">
                <div class="flex items-end gap-1.5 relative">
                    <!-- Dropdown Mention @ -->
                    <div id="chat-mention-dropdown" class="hidden absolute bottom-full left-0 mb-2 w-64 bg-white border border-slate-200 shadow-2xl rounded-xl max-h-48 overflow-y-auto z-50 text-xs custom-scrollbar">
                        <!-- Mention items injected via JS -->
                    </div>

                    <!-- Nút đính kèm tệp -->
                    <label class="cursor-pointer p-2 text-slate-400 hover:text-teal-700 hover:bg-slate-100 rounded-xl transition-colors shrink-0">
                        <i class="ph-bold ph-paperclip text-lg"></i>
                        <input type="file" id="chat-file-input" onchange="handleChatFilesSelected(event)" class="hidden" multiple>
                    </label>

                    <!-- Textarea Tin nhắn -->
                    <textarea id="chat-message-input" rows="1" onkeydown="handleChatInputKeydown(event)" placeholder="Nhập tin nhắn (Enter để gửi, @tag tên)..." class="flex-1 bg-slate-100 border-none rounded-xl px-3 py-2 text-xs focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none resize-none max-h-24 leading-relaxed"></textarea>

                    <!-- Nút Gửi -->
                    <button type="button" onclick="sendChatMessage()" class="p-2 bg-teal-700 hover:bg-teal-800 text-white rounded-xl transition-colors shrink-0 shadow-xs">
                        <i class="ph-bold ph-paper-plane-right text-base"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>
