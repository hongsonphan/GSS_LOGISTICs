<!-- MODAL TẠO NHANH TÀI XẾ DÀNH CHO ĐIỀU VẬN (BIM TMS FIELD DISPATCH) -->
<div id="modal-quick-create-driver" class="hidden-view fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 animate-fade-in" style="display: none;">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md border border-slate-200 overflow-hidden transform transition-all">
        <!-- Header -->
        <div class="px-5 py-3.5 bg-gradient-to-r from-teal-800 to-teal-900 text-white flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-teal-700/80 border border-teal-500/60 flex items-center justify-center text-teal-200 text-base">
                    <i class="ph-bold ph-steering-wheel"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm font-heading tracking-wide">Thêm Nhanh Tài Xế Nhận Lệnh</h3>
                    <p class="text-[11px] text-teal-200">Dành riêng Điều vận tác nghiệp hiện trường</p>
                </div>
            </div>
            <button type="button" onclick="closeQuickCreateDriverModal()" class="w-7 h-7 rounded-lg bg-teal-700/60 hover:bg-teal-700 text-teal-200 hover:text-white flex items-center justify-center cursor-pointer transition-colors">
                <i class="ph-bold ph-x text-sm"></i>
            </button>
        </div>

        <!-- Body Form -->
        <form id="form-quick-create-driver" onsubmit="event.preventDefault(); submitQuickCreateDriver();" class="p-5 space-y-4">
            <input type="hidden" id="quick-driver-target-select-id" value="">
            
            <div class="p-3 bg-amber-50/70 border border-amber-200 rounded-xl flex items-start gap-2.5 text-xs text-amber-900">
                <i class="ph-bold ph-info text-amber-600 text-base shrink-0 mt-0.5"></i>
                <div>
                    <strong>Lưu ý Điều độ:</strong> Chỉ cần nhập <strong>Họ tên</strong> và <strong>Số điện thoại</strong> để điều động xe ngay. Ngày mai bộ phận Nhân sự sẽ kiểm tra và hoàn thiện hồ sơ chuẩn (GPLX, CCCD, Hợp đồng...).
                </div>
            </div>

            <!-- Họ & Tên -->
            <div>
                <label class="block font-bold text-slate-700 text-xs mb-1" for="inp-quick-driver-name">
                    Họ và Tên Tài Xế <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="ph-bold ph-user text-sm"></i>
                    </div>
                    <input type="text" id="inp-quick-driver-name" required
                        placeholder="VD: Nguyễn Văn Hùng..."
                        class="form-input h-9.5 pl-9 pr-3 py-1.5 font-bold text-slate-800 text-xs w-full rounded-xl border-slate-300 focus:ring-teal-500 focus:border-teal-500">
                </div>
                <div id="err-quick-driver-name" class="field-error-msg hidden"></div>
            </div>

            <!-- Số điện thoại -->
            <div>
                <label class="block font-bold text-slate-700 text-xs mb-1" for="inp-quick-driver-phone">
                    Số Điện Thoại (Zalo / Gọi nhận lệnh) <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="ph-bold ph-phone text-sm"></i>
                    </div>
                    <input type="tel" id="inp-quick-driver-phone" required
                        placeholder="VD: 0912345678" maxlength="15"
                        class="form-input h-9.5 pl-9 pr-3 py-1.5 font-mono font-bold text-slate-800 text-xs w-full rounded-xl border-slate-300 focus:ring-teal-500 focus:border-teal-500">
                </div>
                <div id="err-quick-driver-phone" class="field-error-msg hidden"></div>
            </div>

            <!-- Footer Actions -->
            <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
                <button type="button" onclick="closeQuickCreateDriverModal()"
                    class="px-3.5 py-2 text-xs font-bold text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-all cursor-pointer">
                    Hủy bỏ
                </button>
                <button type="submit" id="btn-submit-quick-driver"
                    class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold shadow-xs flex items-center gap-1.5 transition-all cursor-pointer font-heading">
                    <i class="ph-bold ph-check text-sm"></i> Lưu & Chọn Ngay
                </button>
            </div>
        </form>
    </div>
</div>
