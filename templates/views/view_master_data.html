<!-- 8. PHÂN HỆ CÀI ĐẶT & HỆ THỐNG DANH MỤC (MASTER DATA & SETTINGS) -->
<div id="view-cai-dat" class="view hidden-view p-4 md:p-6 h-full flex flex-col bg-slate-50 overflow-y-auto animate-fade-in space-y-4">
    <!-- Main Master Data Container -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden flex flex-col">
        <!-- Sub-Navigation 11 Tabs & Action Button -->
        <div class="border-b border-slate-200 px-3 md:px-4 pt-2 flex items-center justify-between flex-wrap gap-2 bg-slate-50/80 shrink-0">
            <div class="flex items-center space-x-1 overflow-x-auto pb-px" id="master-data-tabs">
                <button onclick="switchMasterDataTab('company')" data-md-tab="company" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-buildings text-base text-teal-700"></i>
                    <span>Khai Báo Thông Tin Công Ty</span>
                </button>
                <button onclick="switchMasterDataTab('roles_permissions')" data-md-tab="roles_permissions" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-shield-check text-base text-blue-600"></i>
                    <span>Vai Trò & Phân Quyền</span>
                </button>
                <button onclick="switchMasterDataTab('opening_balance')" data-md-tab="opening_balance" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-wallet text-base text-emerald-600"></i>
                    <span>Số Dư Đầu Kỳ</span>
                </button>
                <button onclick="switchMasterDataTab('driver_tariffs')" data-md-tab="driver_tariffs" class="md-tab-btn active px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-teal-600 text-teal-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-money text-base text-emerald-600"></i>
                    <span>Biểu Phí Lương Chuyến</span>
                </button>
                <button onclick="switchMasterDataTab('allowances')" data-md-tab="allowances" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-plus-circle text-base text-amber-600"></i>
                    <span>Phụ Cấp & Kiểm Hóa</span>
                </button>
                <button onclick="switchMasterDataTab('locations')" data-md-tab="locations" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-map-pin text-base text-teal-600"></i>
                    <span>Cảng & Kho Bãi</span>
                </button>
                <button onclick="switchMasterDataTab('tariffs')" data-md-tab="tariffs" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-path text-base text-blue-600"></i>
                    <span>Biểu Cước Khách</span>
                </button>
                <button onclick="switchMasterDataTab('customers')" data-md-tab="customers" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-buildings text-base text-purple-600"></i>
                    <span>Khách Hàng</span>
                </button>
                <button onclick="switchMasterDataTab('shipping_lines')" data-md-tab="shipping_lines" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-anchor-simple text-base text-cyan-600"></i>
                    <span>Hãng Tàu</span>
                </button>
                <button onclick="switchMasterDataTab('vehicles')" data-md-tab="vehicles" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-truck text-base text-slate-700"></i>
                    <span>Đầu Kéo & Xe</span>
                </button>
                <button onclick="switchMasterDataTab('trailers')" data-md-tab="trailers" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-arrows-horizontal text-base text-sky-600"></i>
                    <span>Rơ-Moóc</span>
                </button>
                <button onclick="switchMasterDataTab('subcontractors')" data-md-tab="subcontractors" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-handshake text-base text-orange-600"></i>
                    <span>Nhà Xe Thầu Phụ</span>
                </button>
                <button onclick="switchMasterDataTab('expenses')" data-md-tab="expenses" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-receipt text-base text-rose-600"></i>
                    <span>Khoản Chi</span>
                </button>
                <button onclick="switchMasterDataTab('containers')" data-md-tab="containers" class="md-tab-btn px-3 py-2 text-xs md:text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-1.5 transition-all whitespace-nowrap cursor-pointer">
                    <i class="ph-bold ph-package text-base text-indigo-600"></i>
                    <span>Quy Cách</span>
                </button>
            </div>

            <!-- Action Button: Open Create Modal -->
            <div class="pb-2">
                <button onclick="openCreateMasterDataModal()" class="px-3.5 py-1.5 bg-teal-700 hover:bg-teal-800 text-white rounded-lg text-xs md:text-sm font-bold font-heading shadow-xs flex items-center space-x-1.5 transition-colors cursor-pointer">
                    <i class="ph-bold ph-plus-circle text-base"></i>
                    <span id="md-create-btn-label">+ Thêm Mới Tuyến Lương</span>
                </button>
            </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div id="md-filter-toolbar" class="p-2.5 px-3 md:px-4 border-b border-slate-200/80 bg-white flex flex-col sm:flex-row items-center justify-between gap-2 shrink-0">
            <div class="relative w-full sm:w-80">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
                <input type="text" id="md-search-input" onkeyup="filterMasterDataTable()" placeholder="Tìm kiếm nhanh trong bảng..."
                       class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs md:text-sm font-medium focus:outline-hidden focus:ring-2 focus:ring-teal-500 focus:bg-white transition-all">
            </div>

            <!-- Dynamic Sub-Filter -->
            <div class="flex items-center space-x-2 w-full sm:w-auto" id="md-secondary-filter-container">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Bộ lọc:</label>
                <select id="md-secondary-filter" onchange="filterMasterDataTable()"
                        class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs md:text-sm font-bold text-slate-700 focus:outline-hidden focus:ring-2 focus:ring-teal-500">
                    <option value="ALL">Tất cả</option>
                </select>
                <!-- Nút Tùy Chỉnh Cột Danh Mục -->
                <button type="button" onclick="openColumnCustomizer('md-main-table')" 
                    class="text-xs font-bold text-slate-700 hover:text-teal-700 bg-white hover:bg-slate-100 border border-slate-200 shadow-2xs px-2.5 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 cursor-pointer"
                    title="Tùy chỉnh ẩn/hiện và thứ tự các cột">
                    <i class="ph-bold ph-columns text-teal-700"></i>
                    <span>Cột</span>
                </button>
                <button onclick="reloadActiveMasterDataTab()" title="Làm mới dữ liệu" class="p-1.5 text-slate-500 hover:text-teal-700 hover:bg-slate-100 rounded-md transition-colors cursor-pointer">
                    <i class="ph-bold ph-arrows-clockwise text-base"></i>
                </button>
            </div>
        </div>

        <!-- Dynamic Company Profile Dashboard View (Shown when tab is 'company') -->
        <div id="md-company-view" class="hidden p-4 md:p-6 overflow-y-auto min-h-[420px] max-h-[calc(100vh-260px)] bg-slate-50/50">
            <!-- Populated dynamically via JavaScript renderCompanyProfileView -->
        </div>

        <!-- Dynamic Roles & Permissions View (Shown when tab is 'roles_permissions') -->
        <div id="md-roles-permissions-view" class="hidden p-4 md:p-6 overflow-y-auto min-h-[420px] max-h-[calc(100vh-260px)] bg-slate-50/50 space-y-6">
            <!-- Populated dynamically via JavaScript renderRolesPermissionsView -->
        </div>

        <!-- Dynamic Opening Balance View (Shown when tab is 'opening_balance') -->
        <div id="md-opening-balance-view" class="hidden p-4 md:p-6 overflow-y-auto min-h-[420px] max-h-[calc(100vh-260px)] bg-slate-50/50 space-y-6">
            <!-- Populated dynamically via JavaScript renderOpeningBalanceView -->
        </div>

        <!-- Dynamic Data Table Container (Sticky Header & Scrollable Body) -->
        <div id="md-table-container" class="overflow-x-auto relative border-b border-slate-200 erp-table-container min-h-[420px] max-h-[calc(100vh-320px)] overflow-y-auto">
            <table class="w-full text-left border-collapse erp-table whitespace-nowrap" id="md-main-table" data-table-title="Hệ Thống Danh Mục Cài Đặt">
                <thead class="sticky top-0 z-10 bg-slate-100 border-b border-slate-200/90 shadow-2xs" id="md-table-head">
                    <!-- Populated dynamically based on active tab -->
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium" id="md-table-body">
                    <tr>
                        <td colspan="8" class="p-8 text-center text-slate-400">
                            <i class="ph ph-spinner animate-spin text-2xl mb-2 text-teal-600 block"></i>
                            Đang tải danh mục cài đặt...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer Pagination / Record Counter (UI/UX Chuẩn Quốc Tế) -->
        <div class="p-2.5 px-4 bg-slate-50/90 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs font-semibold text-slate-600 select-none shrink-0" id="md-pagination-container">
            <!-- Left: Range info and Rows per page selector -->
            <div class="flex items-center flex-wrap gap-3 w-full sm:w-auto justify-between sm:justify-start">
                <div id="md-pagination-info" class="text-slate-600 font-medium flex items-center space-x-1">
                    <span>Hiển thị</span>
                    <span id="md-range-start" class="font-bold text-slate-900">0</span>
                    <span>-</span>
                    <span id="md-range-end" class="font-bold text-slate-900">0</span>
                    <span>trong</span>
                    <span id="md-count-display" class="font-black text-teal-800">0</span>
                    <span>bản ghi</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-500 font-medium whitespace-nowrap">Số dòng / trang:</span>
                    <select id="md-page-size" onchange="changeMasterDataPageSize(this.value)" class="bg-white border border-slate-200 text-slate-700 text-xs rounded-lg px-2.5 py-1 font-bold focus:ring-2 focus:ring-teal-500 focus:outline-hidden cursor-pointer shadow-2xs">
                        <option value="20" selected>20 dòng</option>
                        <option value="30">30 dòng</option>
                        <option value="50">50 dòng</option>
                        <option value="100">100 dòng</option>
                    </select>
                </div>
            </div>

            <!-- Right: Navigation Controls (First, Prev, Page numbers, Next, Last) -->
            <div class="flex items-center space-x-1" id="md-pagination-controls">
                <!-- Injected dynamically via JavaScript -->
            </div>
        </div>
    </div>
</div>
