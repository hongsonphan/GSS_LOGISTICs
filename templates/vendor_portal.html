<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Cổng nhà xe</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#cbd5e1;--brand:#0f766e;--brand-ink:#fff;--ok:#047857;--okbg:#d1fae5;--warn:#92400e;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--ink:#e2e8f0;--mut:#94a3b8;--line:#334155;--brand:#2dd4bf;--brand-ink:#042f2e;--ok:#6ee7b7;--okbg:#064e3b;--warn:#fcd34d;--warnbg:#451a03;--bad:#fca5a5;--badbg:#450a0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
header{background:var(--brand);color:var(--brand-ink);padding:14px 16px}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:14px;opacity:.9}
main{max-width:760px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px;margin:0}
.grid2 dt{color:var(--mut);font-size:12px}.grid2 dd{margin:0;font-weight:600;word-break:break-word}
.note{border-left:4px solid var(--warn);background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:14px;white-space:pre-wrap}
.note b{display:block;margin-bottom:2px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-overdue{background:var(--badbg);color:var(--bad)}.b-none{background:var(--bg);color:var(--mut)}
.row h2{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input{width:100%;min-height:48px;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus{outline:3px solid var(--brand);outline-offset:1px}
input:disabled{opacity:.6}
.msg{font-size:13px;margin-top:6px}.msg .e{color:var(--bad)}.msg .w{color:var(--warn)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar span{font-size:14px;color:var(--mut)}
button{min-height:48px;padding:0 22px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button:disabled{opacity:.5}
.state{text-align:center;padding:48px 16px}
.hidden{display:none}
@media(max-width:420px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1 id="h-title">Cổng nhà xe</h1><p id="h-sub">Đang tải…</p></header>
<main id="main"><div class="state">Đang tải…</div></main>
<div class="bar hidden" id="bar"><span id="bar-info"></span><button id="save" type="button">Lưu tất cả</button></div>
<script>
(function () {
  var token = location.pathname.split('/').filter(Boolean)[1] || '';
  var API = '/api/vendor/' + encodeURIComponent(token) + '/';
  var FIELDS = [['container_number','Số container','full',''],['seal_number','Số seal','',''],['tractor_plate','Biển số xe đầu kéo *','',''],
    ['trailer_plate','Biển số rơ-moóc','',''],['driver_name','Họ tên tài xế','',''],['driver_phone','SĐT tài xế','','tel'],['vendor_note','Ghi chú nhà xe','full','']];
  var state = null, dirty = {}, main = document.getElementById('main');

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fail(msg) { main.replaceChildren(el('div', 'state', msg)); document.getElementById('bar').classList.add('hidden'); }
  function fmtDate(s) { return s ? s.split('-').reverse().join('/') : ''; }
  function badge(label, d) {
    var map = {ok:['b-ok','Còn hạn'],warn:['b-warn','Sắp hết hạn'],overdue:['b-overdue','QUÁ HẠN'],none:['b-none','Chưa có hạn']};
    var m = map[d.level] || map.none, w = el('div');
    w.append(el('span', null, label + ': ' + (fmtDate(d.expiry) || '—') + ' '), el('span', 'badge ' + m[0], m[1]));
    return w;
  }
  function field(label, value) { var f = document.createDocumentFragment(); f.append(el('dt', null, label), el('dd', null, value || '—')); return f; }
  function note(title, text) { var n = el('div', 'note'); n.append(el('b', null, title), document.createTextNode(text)); return n; }

  function render() {
    var b = state.booking, frag = document.createDocumentFragment();
    document.title = state.company_name + ' · Cổng nhà xe';
    document.getElementById('h-title').textContent = state.company_name + ' · Cổng nhà xe';
    document.getElementById('h-sub').textContent = state.subcontractor + ' — nhận ' + state.allocated_containers + ' cont, booking ' + b.code;
    var info = el('section', 'card'), dl = el('dl', 'grid2');
    [['Số booking', b.booking_number],['Hãng tàu', b.shipping_line],['Loại cont', b.container_size],['Hàng hóa', b.commodity],
     ['Nơi lấy', b.pickup_location],['Nơi giao', b.delivery_location],['Nơi hạ rỗng', b.dropoff_location],
     ['Ngày hẹn', (fmtDate(b.loading_date) + ' ' + (b.loading_time || '')).trim()]]
      .forEach(function (p) { dl.append(field(p[0], p[1])); });
    info.append(dl);
    var hd = el('div'); hd.style.marginTop = '10px'; hd.append(badge('Hạn DEM', b.dem), badge('Hạn DET', b.det)); info.append(hd);
    if (b.destination_notes) info.append(note('Lưu ý điểm đến', b.destination_notes));
    if (b.road_restrictions) info.append(note('Cấm đường / giờ cấm tải', b.road_restrictions));
    frag.append(info);
    var readonly = state.locked || state.expired;
    if (readonly) frag.append(note('Chỉ xem', state.locked ? 'Phiếu đã khóa. Cần sửa xin liên hệ điều vận.' : 'Link đã hết hạn, xin điều vận cấp link mới.'));
    state.rows.forEach(function (row) {
      var card = el('section', 'card row'), h = el('h2');
      h.append(el('span', null, 'Dòng #' + row.line_no), el('span', 'badge ' + (row.trip_code ? 'b-ok' : 'b-none'), row.trip_code ? (row.step_label || 'Đã nhập') : 'Chưa nhập'));
      card.append(h);
      var grid = el('div', 'fields');
      FIELDS.forEach(function (f) {
        var w = el('div', f[2]), id = 'f' + row.line_no + f[0], lab = el('label', null, f[1]);
        lab.htmlFor = id;
        var inp = el('input'); inp.id = id;
        inp.value = (dirty[row.line_no] && dirty[row.line_no][f[0]] != null) ? dirty[row.line_no][f[0]] : (row[f[0]] || '');
        inp.type = f[3] || 'text'; inp.autocomplete = 'off'; inp.maxLength = f[0] === 'vendor_note' ? 255 : 100;
        if (f[0] === 'container_number' || f[0] === 'seal_number' || f[0].indexOf('plate') > -1) inp.setAttribute('autocapitalize', 'characters');
        inp.disabled = readonly || !row.editable;
        inp.addEventListener('input', function () { (dirty[row.line_no] = dirty[row.line_no] || {})[f[0]] = inp.value; updateBar(); });
        w.append(lab, inp); grid.append(w);
      });
      card.append(grid);
      var m = el('div', 'msg'); m.id = 'm' + row.line_no; card.append(m);
      if (!row.editable && !readonly) card.append(el('div', 'msg', 'Chuyến đã bắt đầu chạy — liên hệ điều vận để sửa.'));
      frag.append(card);
    });
    main.replaceChildren(frag);
    document.getElementById('bar').classList.toggle('hidden', !!readonly);
    updateBar();
  }
  function updateBar() {
    var filled = state.rows.filter(function (r) { return r.trip_code; }).length, n = Object.keys(dirty).length;
    document.getElementById('bar-info').textContent = 'Đã nhập xe ' + filled + '/' + state.allocated_containers + (n ? ' · ' + n + ' dòng chưa lưu' : '');
    document.getElementById('save').disabled = !n;
  }
  function load() {
    fetch(API, {headers:{'Accept':'application/json'}, cache:'no-store'}).then(function (r) {
      if (r.status === 404) throw new Error('Link không đúng hoặc đã bị thu hồi. Vui lòng liên hệ điều vận.');
      if (!r.ok) throw new Error('Không tải được dữ liệu. Thử lại sau.');
      return r.json();
    }).then(function (j) { state = j.data; render(); }).catch(function (e) { fail(e.message); });
  }
  document.getElementById('save').addEventListener('click', function () {
    var btn = this, rows = Object.keys(dirty).map(function (k) {
      var base = state.rows.filter(function (r) { return String(r.line_no) === k; })[0] || {};
      return Object.assign({}, base, dirty[k], {line_no: Number(k)});
    });
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    fetch(API, {method:'PUT', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify({rows: rows})})
      .then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
      .then(function (res) {
        btn.textContent = 'Lưu tất cả';
        if (!res.ok) { alert(res.j.message || 'Không lưu được.'); btn.disabled = false; return; }
        var bad = [];
        res.j.results.forEach(function (x) { if (x.ok) delete dirty[x.line_no]; else bad.push(x.line_no); });
        state = res.j.data; render();
        res.j.results.forEach(function (x) {
          var m = document.getElementById('m' + x.line_no); if (!m) return;
          x.errors.forEach(function (t) { m.append(el('div', 'e', t)); });
          x.warnings.forEach(function (t) { m.append(el('div', 'w', t)); });
        });
        if (bad.length) { var first = document.getElementById('m' + bad[0]); if (first) first.scrollIntoView({block:'center'}); }
      }).catch(function () { btn.textContent = 'Lưu tất cả'; btn.disabled = false; alert('Mất kết nối, dữ liệu chưa lưu. Vui lòng thử lại.'); });
  });
  window.addEventListener('beforeunload', function (e) { if (Object.keys(dirty).length) { e.preventDefault(); e.returnValue = ''; } });
  load();
})();
</script>
</body>
</html>
